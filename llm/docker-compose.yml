# Base vetorial local do chatbot. Fica isolada em porta própria (5435) para não
# colidir com outros bancos já em execução na máquina do time.
services:
  rag-db:
    image: pgvector/pgvector:pg17
    container_name: thermal-rag-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: thermal
      POSTGRES_PASSWORD: thermal
      POSTGRES_DB: thermal_rag
    # Publicado apenas em 127.0.0.1: o conteúdo indexado é confidencial e não
    # deve ficar acessível pela rede local.
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - rag-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thermal -d thermal_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rag-db-data:
